[versions]
junit = "6.1.3"
assertj = "3.27.7"
archunit = "1.5.1"
pitestCore = "1.30.0"
pitestJunit5 = "1.2.3"
googleJavaFormat = "1.36.1"
jackson = "3.2.3"
# Jackson 2 arrives only transitively (langchain4j-core); pinned via its BOM for security fixes.
jackson2 = "2.22.3"
jsoup = "1.23.2"
wiremock = "3.13.2"
pmd = "7.28.0"
langchain4jBgeSmall = "1.21.0-beta31"
mcp = "2.0.1"
slf4j = "2.0.20"
spotbugs = "4.10.4"
findsecbugs = "1.14.0"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson2" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
langchain4j-embeddings-bge-small-en-v15-q = { module = "dev.langchain4j:langchain4j-embeddings-bge-small-en-v15-q", version.ref = "langchain4jBgeSmall" }
pmd-cli = { module = "net.sourceforge.pmd:pmd-cli", version.ref = "pmd" }
pmd-java = { module = "net.sourceforge.pmd:pmd-java", version.ref = "pmd" }
mcp-core = { module = "io.modelcontextprotocol.sdk:mcp-core", version.ref = "mcp" }
mcp-json-jackson3 = { module = "io.modelcontextprotocol.sdk:mcp-json-jackson3", version.ref = "mcp" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
findsecbugs = { module = "com.h3xstream.findsecbugs:findsecbugs-plugin", version.ref = "findsecbugs" }

[plugins]
spotless = { id = "com.diffplug.spotless", version = "8.10.3" }
pitest = { id = "info.solidsoft.pitest", version = "1.19.0" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
spotbugs = { id = "com.github.spotbugs", version = "6.5.12" }
