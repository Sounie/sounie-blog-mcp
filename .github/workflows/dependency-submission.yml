name: Dependency submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      # Submits the resolved Gradle graph so Dependabot alerts cover transitive dependencies (ADR 0008).
      # v5, not v6: v6 requires accepting Gradle's Terms of Use (see ci.yml).
      # May fail on Gradle 9.8.0: https://github.com/gradle/actions/issues/1088
      - uses: gradle/actions/dependency-submission@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
