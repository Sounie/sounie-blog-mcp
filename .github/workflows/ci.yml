name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The Dependabot verification metadata workflow starts CI on its own commit (ADR 0008).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      # v6 requires accepting Gradle's Terms of Use for its closed-source caching component;
      # staying on v5 until the owner decides.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Check (tests, ArchUnit, coverage, formatting)
        run: ./gradlew check pitest jarTest
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            core/build/reports/jacoco/
            core/build/reports/pitest/
            core/build/reports/tests/
            providers/*/build/reports/tests/
